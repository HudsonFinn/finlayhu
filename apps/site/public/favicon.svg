<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<style>
		.bg { fill: #f1f3f2; }
		.line { stroke: #14201e; }
		.node { stroke: #0c6157; fill: #f1f3f2; }
		@media (prefers-color-scheme: dark) {
			.bg { fill: #0d1615; }
			.line { stroke: #e3ecea; }
			.node { stroke: #4fbfae; fill: #0d1615; }
		}
	</style>
	<!-- The Boundary Node mark: two lines meeting at a hollow node -->
	<rect class="bg" width="32" height="32" rx="4" />
	<path class="line" d="M3 16H10.5M21.5 16H29" stroke-width="3.5" />
	<circle class="node" cx="16" cy="16" r="5.5" stroke-width="3.5" />
</svg>
