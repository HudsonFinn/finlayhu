<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Finlay Hudson: a software engineer who writes Boundary Node, the electricity system's data, explained."
		/>
		<title>Finlay Hudson</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link
			rel="icon"
			href="/favicon-32.png"
			type="image/png"
			sizes="32x32"
		/>
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta
			name="theme-color"
			content="#0d1615"
			media="(prefers-color-scheme: dark)"
		/>
		<meta
			name="theme-color"
			content="#f1f3f2"
			media="(prefers-color-scheme: light)"
		/>
		<script>
			// Apply the saved theme before first paint, so the page never flashes the wrong one.
			// Night is the default until the visitor picks (see ThemeSwitch).
			try {
				var choice = localStorage.getItem('sl-theme') || 'dark';
				if (choice !== 'system')
					document.documentElement.setAttribute('data-theme', choice);
			} catch (e) {
				document.documentElement.setAttribute('data-theme', 'dark');
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
